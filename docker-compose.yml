# MAM! local stack. Usage:
#   copy .env.example .env   (then edit secrets)
#   docker compose up -d --build
#   docker compose --profile storage up -d   # adds MinIO (S3-compatible) for photo storage
name: mam

x-api-env: &api-env
  NODE_ENV: ${NODE_ENV:-production}
  PORT: 4000
  DATABASE_URL: postgresql://${POSTGRES_USER:-mam}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-mam}?schema=public&connection_limit=10
  REDIS_URL: redis://redis:6379
  API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:4000}
  WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost:3000}
  ADMIN_PUBLIC_URL: ${ADMIN_PUBLIC_URL:-http://localhost:3001}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
  TRUST_PROXY: ${TRUST_PROXY:-2}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
  COOKIE_SECRET: ${COOKIE_SECRET:?set COOKIE_SECRET in .env}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
  GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
  GOOGLE_OAUTH_REDIRECT_URI_WEB: ${GOOGLE_OAUTH_REDIRECT_URI_WEB:-}
  GOOGLE_OAUTH_REDIRECT_URI_ADMIN: ${GOOGLE_OAUTH_REDIRECT_URI_ADMIN:-}
  GOOGLE_OAUTH_ALLOWED_AUDIENCES: ${GOOGLE_OAUTH_ALLOWED_AUDIENCES:-}
  GOOGLE_MAPS_SERVER_API_KEY: ${GOOGLE_MAPS_SERVER_API_KEY:-}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  STORAGE_LOCAL_DIR: /data/storage
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-auto}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
  BOOTSTRAP_SUPER_ADMIN_EMAILS: ${BOOTSTRAP_SUPER_ADMIN_EMAILS:-}
  DEV_LOGIN_ENABLED: ${DEV_LOGIN_ENABLED:-false}

services:
  postgres:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mam}
    ports: ['127.0.0.1:5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-mam} -d ${POSTGRES_DB:-mam}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ['redis-server', '--save', '', '--appendonly', 'no', '--maxmemory', '256mb', '--maxmemory-policy', 'allkeys-lru']
    ports: ['127.0.0.1:6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 20

  migrate:
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile }
    command: ['sh', '-c', 'npx prisma migrate deploy && node dist-seed/prisma/seed.js']
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  api:
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile }
    restart: unless-stopped
    environment: *api-env
    ports: ['127.0.0.1:4000:4000']
    volumes: [storage:/data/storage]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:4000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/next.Dockerfile
      args:
        APP: web
        NEXT_PUBLIC_GOOGLE_MAPS_BROWSER_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_BROWSER_KEY:-}
        NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID: ${NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID:-DEMO_MAP_ID}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
      PORT: 3000
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      api: { condition: service_healthy }

  admin:
    build:
      context: .
      dockerfile: infrastructure/docker/next.Dockerfile
      args: { APP: admin }
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
      PORT: 3001
    ports: ['127.0.0.1:3001:3001']
    depends_on:
      api: { condition: service_healthy }

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: [storage]
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-mamdev}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-CHANGE_ME_MINIO_PASSWORD}
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: [minio:/data]

volumes:
  pgdata:
  storage:
  minio:
