name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 2 * * 1'   # weekly, Monday 09:00 WIB

permissions:
  contents: read
  security-events: write

jobs:
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: npm audit (production dependencies, high+)
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [javascript-typescript, java-kotlin]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'java-kotlin' && 'manual' || 'none' }}
      - if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - if: matrix.language == 'java-kotlin'
        working-directory: apps/android
        run: chmod +x gradlew && ./gradlew assembleDebug --console=plain
      - uses: github/codeql-action/analyze@v3

  placeholder-secrets:
    name: No placeholder secrets in deploy config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if real-looking keys are committed
        run: |
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}|GOCSPX-[0-9A-Za-z_-]{20,}' -- ':!*.md'; then
            echo "::error::Google API key or OAuth secret committed"; exit 1; fi
