# Tuned for low-memory machines (≈8 GB RAM / small page file). Raise -Xmx on larger machines.
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.workers.max=2
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Compile Kotlin inside the Gradle daemon instead of spawning a second JVM.
kotlin.compiler.execution.strategy=in-process
