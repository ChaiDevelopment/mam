# MAM! production reverse proxy (nginx ≥ 1.25). TLS terminates here.
#   mam.id        → web   (Next.js, proxies /api/v1 to the API internally)
#   admin.mam.id  → admin (Next.js) — restrict by IP/VPN where possible
# The API is NOT exposed publicly; browsers reach it through the Next.js same-origin proxy,
# Android reaches it at api.mam.id.

limit_req_zone $binary_remote_addr zone=mam_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=mam_auth:10m rate=10r/m;
client_max_body_size 9m;   # 8 MB photo + multipart overhead

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

upstream mam_web   { server 127.0.0.1:3000; keepalive 32; }
upstream mam_admin { server 127.0.0.1:3001; keepalive 8; }
upstream mam_api   { server 127.0.0.1:4000; keepalive 32; }

server {
  listen 80;
  server_name mam.id admin.mam.id api.mam.id;
  return 301 https://$host$request_uri;
}

# Shared TLS settings — certificates via certbot / your CA.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

server {
  listen 443 ssl;
  http2 on;
  server_name mam.id;
  ssl_certificate     /etc/letsencrypt/live/mam.id/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/mam.id/privkey.pem;

  # Metrics are internal only.
  location /api/v1/health/metrics { return 404; }

  location /api/v1/auth/ {
    limit_req zone=mam_auth burst=20 nodelay;
    proxy_pass http://mam_web;
    include /etc/nginx/snippets/mam-proxy.conf;
  }
  location /api/ {
    limit_req zone=mam_api burst=40 nodelay;
    proxy_pass http://mam_web;
    include /etc/nginx/snippets/mam-proxy.conf;
  }
  location /_next/static/ {
    proxy_pass http://mam_web;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location / {
    proxy_pass http://mam_web;
    include /etc/nginx/snippets/mam-proxy.conf;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name admin.mam.id;
  ssl_certificate     /etc/letsencrypt/live/admin.mam.id/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/admin.mam.id/privkey.pem;
  # allow 203.0.113.0/24;  # office / VPN
  # deny all;
  add_header X-Robots-Tag "noindex, nofollow" always;
  location /api/v1/health/metrics { return 404; }
  location / {
    limit_req zone=mam_api burst=40 nodelay;
    proxy_pass http://mam_admin;
    include /etc/nginx/snippets/mam-proxy.conf;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name api.mam.id;   # Android clients (Bearer tokens)
  ssl_certificate     /etc/letsencrypt/live/api.mam.id/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.mam.id/privkey.pem;
  location /api/v1/health/metrics { allow 127.0.0.1; deny all; proxy_pass http://mam_api; }
  location /api/docs { return 404; }
  location /api/v1/auth/ {
    limit_req zone=mam_auth burst=20 nodelay;
    proxy_pass http://mam_api;
    include /etc/nginx/snippets/mam-proxy.conf;
  }
  location /api/ {
    limit_req zone=mam_api burst=40 nodelay;
    proxy_pass http://mam_api;
    include /etc/nginx/snippets/mam-proxy.conf;
  }
  location / { return 404; }
}
